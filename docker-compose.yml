services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Named volume, NOT a Windows bind mount — SQLite needs real POSIX
      # locking, which Docker Desktop's host file shares don't provide
      # (bind-mounting the db file causes stale reads / lost writes).
      - paluszki-db:/app/data
    environment:
      # Relative path, resolved against WORKDIR /app
      - DATABASE_URL=sqlite+aiosqlite:///data/test.db
      - PALUSZKI_TRANSLATION_ENABLED=1
      - PALUSZKI_ML_SERVICE_URL=http://ml:8001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      ml:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: https://paluszki-back.ivk.pl/api
        NEXT_PUBLIC_WS_BASE_URL: wss://paluszki-back.ivk.pl/ws
        # Self-hosted TURN relay (the coturn service below). NOTE: for peers
        # outside this network the router must forward UDP/TCP 3478 and
        # UDP 49160-49200 to this machine; unreachable TURN is ignored by ICE.
        NEXT_PUBLIC_TURN_HOST: 130.255.153.202
        NEXT_PUBLIC_TURN_USERNAME: paluszki
        NEXT_PUBLIC_TURN_PASSWORD: paluszki-turn-7c4dff
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy

  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # TURN relay for WebRTC: when direct P2P can't traverse the NATs, media is
  # relayed through here. External reachability requires forwarding UDP/TCP
  # 3478 + UDP 49160-49200 on the router to this machine.
  coturn:
    image: coturn/coturn
    restart: unless-stopped
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"
    command: >
      -n
      --log-file=stdout
      --listening-port=3478
      --min-port=49160
      --max-port=49200
      --realm=paluszki
      --user=paluszki:paluszki-turn-7c4dff
      --lt-cred-mech
      --fingerprint
      --no-multicast-peers
      --no-cli
      --external-ip=$$(detect-external-ip)

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      # Keep the model loaded; the default 5m idle unload would force a slow
      # cold start (and client timeouts) on the next translation flush.
      - OLLAMA_KEEP_ALIVE=24h
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # One-shot: pull the LLM (no-op once cached), then warm-load it into VRAM
  # so the first translation flush doesn't hit a multi-minute cold start.
  ollama-init:
    image: ollama/ollama
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull gemma4:e2b && ollama run gemma4:e2b 'Odpowiedz jednym słowem: ok'"]
    restart: "no"

volumes:
  ollama-models:
  paluszki-db:
