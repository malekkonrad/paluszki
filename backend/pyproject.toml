[project]
name = "backend"
version = "0.1.0"
description = "MeetFlow video chat backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.135.1",
    "sqlalchemy>=2.0.48",
    "aiosqlite>=0.21.0",
    "pyjwt>=2.10.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic[email]>=2.0.0",
]

[dependency-groups]
dev = [
    "setuptools>=82.0.1",
]
