project:
  name: sign-language-recognition
  seed: 42
  output_dir: artifacts/merged30

mlflow:
  enabled: true
  tracking_uri: file:./mlruns
  experiment_name: merged-baselines
  run_name: keypoint_classifier_merged30

data:
  task: classification
  dataset_type: merged
  num_classes: 30
  num_frames: 32
  normalize_keypoints: true
  val_split: 0.2

  # MS-ASL paths
  msasl_dir: datasets/ms-asl
  msasl_kp_dir: datasets/ms-asl/keypoints

  # WLASL paths
  wlasl_json: datasets/WLASL/WLASL_v0.3.json
  wlasl_video_dir: datasets/WLASL/videos
  wlasl_kp_dir: datasets/WLASL/keypoints

model:
  pipeline_name: keypoint_classifier
  keypoint_dim: 225
  d_model: 128
  nhead: 4
  num_encoder_layers: 2
  classifier_hidden: 256
  dropout: 0.4
  label_smoothing: 0.1
  pooling: mean

augmentation:
  enabled: true
  rotation_max_deg: 15
  scale_range: [0.85, 1.15]
  translate_max: 0.05
  time_warp_range: [0.8, 1.2]
  frame_drop_prob: 0.1
  gaussian_std: 0.01
  landmark_dropout_prob: 0.05

train:
  batch_size: 16
  num_workers: 4
  epochs: 150
  lr: 0.0005
  weight_decay: 0.02
  device: cuda
