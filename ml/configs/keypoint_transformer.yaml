project:
  name: sign-language-translation
  seed: 42
  output_dir: artifacts/keypoint_transformer

mlflow:
  enabled: true
  tracking_uri: file:./mlruns
  experiment_name: how2sign-baselines
  run_name: keypoint_transformer_trainval_nf32_bs8_lr3e-4

data:
  dataset_type: keypoint
  csv_separator: "\t"
  train_csv_path: datasets/How2Sign/sentence_level/train/text/en/raw_text/re_aligned/how2sign_realigned_train.csv
  val_csv_path: datasets/How2Sign/sentence_level/val/text/en/raw_text/re_aligned/how2sign_realigned_val.csv
  train_video_dir: datasets/How2Sign/sentence_level/train/rgb_front/raw_videos
  val_video_dir: datasets/How2Sign/sentence_level/val/rgb_front/raw_videos
  # Cache extracted keypoints to disk — saves re-running MediaPipe every epoch
  keypoint_cache_dir: datasets/keypoint_cache
  video_id_column: VIDEO_ID
  source_video_column: VIDEO_NAME
  sentence_id_column: SENTENCE_ID
  video_column: SENTENCE_NAME
  start_time_column: START_REALIGNED
  end_time_column: END_REALIGNED
  text_column: SENTENCE
  num_frames: 32         # more frames affordable now (no image tensors)
  image_size: 224        # unused by KeypointDataset, kept for infer.py compat
  max_text_len: 64

model:
  pipeline_name: keypoint_transformer
  keypoint_dim: 225      # pose(99) + left_hand(63) + right_hand(63)
  d_model: 256
  nhead: 8
  num_layers: 4
  dropout: 0.3           # higher than CNN baseline to fight overfitting
  label_smoothing: 0.1

train:
  batch_size: 8          # can afford larger batch without image memory
  num_workers: 4
  epochs: 50
  lr: 0.0003
  weight_decay: 0.01
  device: cuda
