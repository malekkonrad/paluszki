project:
  name: sign-language-translation
  seed: 42
  output_dir: artifacts

mlflow:
  enabled: true
  tracking_uri: file:./mlruns
  experiment_name: how2sign-baselines
  run_name: cnn_transformer_how2sign_nf16_bs2_lr1e-4

data:
  csv_path: datasets/How2Sign/sentence_level/val/text/en/raw_text/re_aligned/how2sign_realigned_val.csv
  csv_separator: "\t"
  video_dir: datasets/How2Sign/sentence_level/val/rgb_front/raw_videos
  video_id_column: VIDEO_ID
  source_video_column: VIDEO_NAME
  sentence_id_column: SENTENCE_ID
  video_column: SENTENCE_NAME
  start_time_column: START_REALIGNED
  end_time_column: END_REALIGNED
  text_column: SENTENCE
  num_frames: 16
  image_size: 224
  max_text_len: 40
  train_split: 0.9

model:
  pipeline_name: cnn_transformer
  d_model: 256
  nhead: 8
  num_layers: 4
  dropout: 0.1

train:
  batch_size: 2
  num_workers: 2
  epochs: 10
  lr: 0.0001
  weight_decay: 0.01
  device: cuda
