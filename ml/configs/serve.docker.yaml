# serve.yaml variant for docker compose: same pipeline knobs, but the LLM
# lives in the `ollama` service (not localhost) and the label map is pinned
# to the copy baked into the image (datasets/ are not shipped).
# Selected via PALUSZKI_SERVE_CONFIG=configs/serve.docker.yaml (ml/Dockerfile).

classifier:
  config_path: configs/asl_citizen100.yaml
  checkpoint: artifacts/asl_citizen100/best_model.pt
  label_map: artifacts/asl_citizen100/label_map.json
  device: cuda                    # runner falls back to cpu if no GPU is exposed
  top_k: 5

llm:
  type: openai_compat
  model: gemma4:e2b
  base_url: http://ollama:11434/v1
  max_tokens: 256
  temperature: 0.0
  timeout: 300                    # cold model load into VRAM exceeds the 30s
                                  # default; a shorter timeout aborts the load
  extra_body:                     # e2b is a thinking model; disable CoT so it
    reasoning_effort: none        # answers directly (else reasoning eats tokens)

pipeline:
  target_lang: pl                 # 'pl' | 'en'
  min_confidence: 0.3             # drop segments where top-1 prob < this

  # Tuned for the production stream: the browser captures at 15 fps
  # (useSignTranslationCapture), not the 30 fps the local webcam script uses.
  segmenter:
    motion_threshold: 0.02        # smoothed mean-abs-diff of hand keypoints
    pause_frames: 15              # ~1s @ 15fps of stillness → end of sign
                                  # (shorter pauses were splitting one sign
                                  # into several detections)
    min_segment_frames: 4         # ~0.27s minimum sign length
    max_segment_frames: 45        # ~3s maximum (safety cap)
    velocity_smoothing: 0.5

  # The sentence is retranslated after EVERY accepted sign (live updates);
  # the buffer holds "the sentence so far" instead of flushing per pause.
  buffer:
    max_segments: 8               # commit the sentence after this many signs
    flush_pause_ms: 10000         # idle this long → sentence closed, next sign starts fresh

  # Match the training-time extraction exactly (extract_keypoints_from_video:
  # static_image_mode=True, confidence 0.3) — tracking mode feeds the
  # classifier keypoints from a different distribution than it was trained on.
  extractor:
    static_image_mode: true
    min_detection_confidence: 0.3
    min_tracking_confidence: 0.3
